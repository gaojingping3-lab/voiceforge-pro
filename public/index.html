<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoiceForge Pro | 多模态语音合成与克隆</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.0/dist/full.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
        [data-theme="dark"] .glass-panel {
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        body { transition: background-color 0.3s ease; }
    </style>
</head>
<body class="min-h-screen bg-base-200 bg-[url('bg.jpg')] bg-cover bg-center bg-fixed text-base-content">
    <div class="navbar bg-base-100/90 backdrop-blur sticky top-0 z-50 shadow-sm border-b border-base-content/10">
        <div class="flex-1">
            <a class="btn btn-ghost normal-case text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary">
                <i class="fa-solid fa-microphone-lines text-primary"></i> VoiceForge Pro
            </a>
        </div>
        <div class="flex-none gap-2">
            <button class="btn btn-ghost btn-circle" id="theme-toggle" title="切换暗黑模式">
                <i class="fa-solid fa-moon text-lg"></i>
            </button>
            <button class="btn btn-ghost btn-circle" onclick="settings_modal.showModal()" title="设置">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
        </div>
    </div>

    <main class="container mx-auto max-w-3xl p-4 mt-4">
        <div class="tabs tabs-boxed mb-4 bg-base-100/80 backdrop-blur p-1 rounded-xl shadow-sm">
            <a class="tab tab-active text-base font-medium h-12 flex-1 rounded-lg" id="tab-tts" onclick="switchTab('tts')"><i class="fa-solid fa-keyboard mr-2"></i>文本转语音</a>
            <a class="tab text-base font-medium h-12 flex-1 rounded-lg" id="tab-chat" onclick="switchTab('chat')"><i class="fa-solid fa-comments mr-2"></i>AI语音对话</a>
            <a class="tab text-base font-medium h-12 flex-1 rounded-lg" id="tab-clone" onclick="switchTab('clone')"><i class="fa-solid fa-dna mr-2"></i>声音克隆</a>
            <a class="tab text-base font-medium h-12 flex-1 rounded-lg" id="tab-history" onclick="switchTab('history')"><i class="fa-solid fa-clock-rotate-left mr-2"></i>历史记录</a>
        </div>

        <!-- TTS Section -->
        <div id="tts-section" class="card glass-panel shadow-xl">
            <div class="card-body p-6">
                <!-- API Key Bar directly on top -->
                <div class="p-3 bg-primary/10 border border-primary/20 rounded-xl mb-4 flex flex-col sm:flex-row items-center gap-3">
                    <div class="flex items-center gap-2 text-primary font-bold whitespace-nowrap">
                        <i class="fa-solid fa-key"></i> <span id="api-key-label">Fish API 密钥:</span>
                    </div>
                    <input type="password" id="main-api-key" placeholder="在此直接粘贴 API Key (自动保存)" class="input input-bordered input-sm w-full font-mono text-sm" />
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
                    <div class="form-control w-full">
                        <label class="label py-1"><span class="label-text font-bold">引擎选择</span></label>
                        <select class="select select-bordered select-sm w-full" id="tts-engine" onchange="onEngineChange()">
                            <option value="fish">Fish TTS (推荐)</option>
                            <option value="siliconflow">SiliconFlow (硅基流动)</option>
                            <option value="aliyun">阿里云语音合成</option>
                        </select>
                    </div>
                    <div class="form-control w-full">
                        <label class="label py-1"><span class="label-text font-bold">模型 ID (Voice/Ref ID)</span></label>
                        <input type="text" id="voice-id" placeholder="留空为默认音色" class="input input-bordered input-sm w-full font-mono text-sm" />
                    </div>
                    <div class="form-control w-full">
                        <label class="label py-1"><span class="label-text font-bold">格式</span></label>
                        <select class="select select-bordered select-sm w-full" id="tts-format">
                            <option value="mp3">MP3</option>
                            <option value="wav">WAV</option>
                            <option value="opus">Opus</option>
                        </select>
                    </div>
                </div>

                <div class="form-control w-full mb-3">
                    <label class="label py-1">
                        <span class="label-text font-bold">文本内容</span>
                        <span id="char-count" class="label-text-alt text-gray-500">0 字</span>
                    </label>
                    <textarea id="tts-text" class="textarea textarea-bordered h-36 text-base leading-relaxed resize-none font-sans" placeholder="输入要合成的文字内容..."></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="label py-0"><span class="label-text text-xs">语速: <span id="val-speed" class="font-bold">1.0</span></span></label>
                        <input type="range" id="tts-speed" min="0.5" max="2.0" value="1.0" step="0.1" class="range range-primary range-xs" oninput="document.getElementById('val-speed').innerText = this.value" />
                    </div>
                    <div>
                        <label class="label py-0"><span class="label-text text-xs">情感参考 (Prompt)</span></label>
                        <input type="text" id="tts-prompt" placeholder="例如：温柔、愤怒地大喊" class="input input-bordered input-xs w-full" />
                    </div>
                </div>

                <div class="card-actions justify-end mt-2">
                    <button id="btn-generate" class="btn btn-primary w-full sm:w-auto px-10 rounded-full shadow-lg hover:shadow-primary/40 transition-all">
                        <i class="fa-solid fa-circle-play mr-2"></i> 开始合成音频
                    </button>
                </div>

                <!-- Result Player -->
                <div id="result-player" class="mt-5 p-4 bg-base-100/90 rounded-2xl border border-base-content/10 hidden flex-col items-center gap-3">
                    <div class="w-full flex justify-between items-center">
                        <h3 class="font-bold text-sm text-primary"><i class="fa-solid fa-waveform-lines"></i> 播放合成结果</h3>
                        <span id="audio-duration" class="text-xs opacity-60"></span>
                    </div>
                    <audio id="audio-playback" controls class="w-full h-10 rounded-lg"></audio>
                    <div class="flex gap-2 self-end mt-1">
                        <a id="btn-download" class="btn btn-sm btn-success text-white px-5 rounded-full" download="voiceforge_output.mp3">
                            <i class="fa-solid fa-download mr-1"></i> 下载音频
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- AI Chat Section -->
        <div id="chat-section" class="card glass-panel shadow-xl hidden">
            <div class="card-body p-4 sm:p-6">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="card-title text-lg"><i class="fa-solid fa-comments text-primary"></i> 与安 语音对话</h2>
                    <button class="btn btn-ghost btn-xs" onclick="clearChat()"><i class="fa-solid fa-trash"></i> 清空</button>
                </div>
                <div class="alert alert-info py-2 px-3 text-xs mb-3">
                    <i class="fa-solid fa-info-circle"></i>
                    <span>AI 回复会自动用你当前选中的克隆声音朗读。需先在「文本转语音」页配置好 API Key 和声音 ID。</span>
                </div>
                <div id="chat-messages" class="bg-base-100/80 rounded-2xl p-4 h-80 sm:h-96 overflow-y-auto flex flex-col gap-3 mb-3">
                    <div class="chat chat-start">
                        <div class="chat-bubble bg-base-200 text-base-content">你好呀，我是安。今天想跟我聊点什么？</div>
                    </div>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="chat-input" placeholder="跟安说点什么..." class="input input-bordered input-sm flex-1" onkeypress="if(event.key==='Enter')sendChatMessage()" />
                    <button id="btn-chat-send" class="btn btn-primary btn-sm px-5 rounded-full" onclick="sendChatMessage()">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
        <!-- Clone Section -->
        <div id="clone-section" class="card glass-panel shadow-xl hidden">
            <div class="card-body p-6">
                <h2 class="card-title text-xl mb-2"><i class="fa-solid fa-dna text-secondary"></i> 声音克隆 (Zero-Shot)</h2>
                <div class="alert alert-info py-2 px-3 text-xs mb-4">
                    <i class="fa-solid fa-info-circle"></i>
                    <span>上传 5~15 秒无杂音的人声干音文件，系统将直接提取声音特征。</span>
                </div>

                <div class="form-control w-full mb-3">
                    <label class="label py-1"><span class="label-text font-bold">模型名称</span></label>
                    <input type="text" id="clone-name" placeholder="例如：定制角色音色" class="input input-bordered input-sm w-full" />
                </div>

                <div class="form-control w-full mb-4">
                    <label class="label py-1"><span class="label-text font-bold">参考音频文本 (Prompt Text)</span></label>
                    <input type="text" id="clone-ref-text" placeholder="音频里说的原话（准确填写克隆相似度大幅提升）" class="input input-bordered input-sm w-full" />
                </div>

                <div class="form-control w-full mb-6">
                    <label class="label py-1"><span class="label-text font-bold">选择参考音频 (.wav / .mp3)</span></label>
                    <input type="file" id="clone-file" class="file-input file-input-bordered file-input-sm w-full" accept="audio/*" />
                </div>

                <div class="card-actions justify-end">
                    <button id="btn-clone" class="btn btn-secondary px-8 rounded-full">
                        <i class="fa-solid fa-microchip mr-2"></i> 上传并创建模型
                    </button>
                </div>
            </div>
        </div>

        <!-- History Section -->
        <div id="history-section" class="card glass-panel shadow-xl hidden">
            <div class="card-body p-6">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="card-title text-xl"><i class="fa-solid fa-clock-rotate-left text-accent"></i> 生成历史</h2>
                    <button class="btn btn-ghost btn-xs text-error" onclick="clearHistory()"><i class="fa-solid fa-trash"></i> 清空</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="table table-sm w-full">
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>引擎</th>
                                <th>文本</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="history-list">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Settings Modal -->
    <dialog id="settings_modal" class="modal modal-bottom sm:modal-middle">
        <div class="modal-box glass-panel">
            <h3 class="font-bold text-lg border-b border-base-content/10 pb-2 mb-4"><i class="fa-solid fa-sliders"></i> 全局 API 凭证管理</h3>
            <p class="text-xs text-base-content/70 mb-4">保存后将持久化储存在本地浏览器（LocalStorage）。在前端即可直接调用真实服务。</p>
            
            <div class="form-control mb-3">
                <label class="label py-1"><span class="label-text text-sm">Fish TTS API Key</span></label>
                <input type="password" id="modal-key-fish" class="input input-bordered input-sm w-full font-mono" placeholder="从 fish.audio 获取的 API Key" />
            </div>
            <div class="form-control mb-3">
                <label class="label py-1"><span class="label-text text-sm">SiliconFlow (硅基流动) API Key</span></label>
                <input type="password" id="modal-key-sili" class="input input-bordered input-sm w-full font-mono" placeholder="sk-..." />
            </div>
            <div class="form-control mb-6">
                <label class="label py-1"><span class="label-text text-sm">阿里云 AppKey / Token</span></label>
                <input type="password" id="modal-key-aliyun" class="input input-bordered input-sm w-full font-mono" placeholder="阿里云鉴权凭证" />
            </div>
            <div class="divider my-2 text-xs">AI 对话配置</div>
            <div class="form-control mb-3">
                <label class="label py-1"><span class="label-text text-sm">大模型 API 地址 (Base URL)</span></label>
                <input type="text" id="modal-llm-url" class="input input-bordered input-sm w-full font-mono" placeholder="https://api.deepseek.com" />
            </div>
            <div class="form-control mb-3">
                <label class="label py-1"><span class="label-text text-sm">大模型 API Key</span></label>
                <input type="password" id="modal-llm-key" class="input input-bordered input-sm w-full font-mono" placeholder="sk-... (DeepSeek)" />
            </div>
            <div class="form-control mb-6">
                <label class="label py-1"><span class="label-text text-sm">大模型名称 (Model)</span></label>
                <input type="text" id="modal-llm-model" class="input input-bordered input-sm w-full font-mono" placeholder="deepseek-v4-flash" />
            </div>
            
            <div class="modal-action">
                <button class="btn btn-primary btn-sm px-6 rounded-full" onclick="saveModalKeys()">保存设置</button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
    </dialog>

    <script src="assets/js/app.js"></script>
</body>
</html>
